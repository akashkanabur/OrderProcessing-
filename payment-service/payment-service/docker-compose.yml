services:

  zookeeper:
    image: zookeeper:3.9.5
    container_name: order-zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: bitnamilegacy/kafka:3.9.0-debian-12-r8
    container_name: order-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: order-zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"